<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" shape-rendering="crispEdges">
  <g id="active">
    <rect x="0" y="0" width="13" height="13" fill="#000000"/>
    <rect x="1" y="1" width="11" height="11" fill="#ffffff"/>
    <rect x="2" y="6" width="9" height="1" fill="#000000"/>
  </g>
  <g id="hover">
    <rect x="0" y="0" width="13" height="13" fill="#000000"/>
    <rect x="1" y="1" width="11" height="11" fill="#ffffff"/>
    <rect x="2" y="6" width="9" height="1" fill="#000000"/>
  </g>
  <g id="pressed">
    <rect x="0" y="0" width="13" height="13" fill="#000000"/>
    <rect x="1" y="1" width="11" height="11" fill="#bbbbbb"/>
    <rect x="2" y="6" width="9" height="1" fill="#000000"/>
  </g>
  <g id="deactivated">
    <rect x="0" y="0" width="13" height="13" fill="#000000" fill-opacity="0"/>
  </g>
  <g id="inactive">
    <rect x="0" y="0" width="13" height="13" fill="#000000" fill-opacity="0"/>
  </g>
  <g id="hover-inactive">
    <rect x="0" y="0" width="13" height="13" fill="#000000" fill-opacity="0"/>
  </g>
  <g id="pressed-inactive">
    <rect x="0" y="0" width="13" height="13" fill="#000000" fill-opacity="0"/>
  </g>
  <g id="deactivated-inactive">
    <rect x="0" y="0" width="13" height="13" fill="#000000" fill-opacity="0"/>
  </g>
</svg>
